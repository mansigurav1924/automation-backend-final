services:
  # The Node.js Backend API
  - type: web
    name: offer-letter-api
    env: docker
    rootDir: server
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      # Important: You will need to set these environment variables in your Render Dashboard:
      # - DATABASE_URL / SUPABASE_URL / SUPABASE_KEY (if using Supabase)
      # - JWT_SECRET
      # - GOOGLE_APPLICATION_CREDENTIALS (you can paste the JSON content directly, or link a file)
      # - GOOGLE_SHEET_ID

  # The Vite React Frontend
  - type: web
    name: offer-letter-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: offer-letter-api
          envVarKey: RENDER_EXTERNAL_URL
